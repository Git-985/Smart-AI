# 本地/单机部署：只跑应用本体，SQLite 存在容器内（生产请用 deploy/docker-compose.prod.yml）。
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SMART_AI_DB_PATH: /app/data/smart-ai.sqlite
    volumes:
      - smartai_data:/app/data

volumes:
  smartai_data:
