services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

  postgres:
    profiles: ["database"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smart_ai
      POSTGRES_PASSWORD: smart_ai_dev
      POSTGRES_DB: smart_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_ai -d smart_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
